[workspace]
resolver = "3"
members = [
    "crates/caret-app",
    "crates/caret-build",
    "crates/caret-doc",
    "crates/caret-dsl-core",
    "crates/caret-dslc",
    "crates/caret-engine",
    "crates/caret-ffi",
    "crates/caret-foundation",
    "crates/caret-layout",
    "crates/launcher",
    "tests",
]
# 默认成员只有桌面 launcher。裸 `cargo run` 打开 M0 文档窗口，页面仍是占位。
# `cargo test` 不带 `--workspace` 时只测 launcher。
default-members = ["crates/launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 支持下限由当前使用的标准库 / 依赖 API 决定（Atomic::try_update 要求 1.95）。
# 日常工具链由 rust-toolchain.toml 锁定；resolver 3 按此下限解析依赖。
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/VibeSTEM/caret"

[workspace.dependencies]
libc = "0.2"
base64 = "0.23.1"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
caret-app = { path = "crates/caret-app", version = "0.1.0" }
caret-doc = { path = "crates/caret-doc", version = "0.1.0" }
caret-engine = { path = "crates/caret-engine", version = "0.1.0" }
caret-build = { path = "crates/caret-build", version = "0.1.0" }
caret-foundation = { path = "crates/caret-foundation", version = "0.1.0" }
caret-layout = { path = "crates/caret-layout", version = "0.1.0" }
caret-dsl-core = { path = "crates/caret-dsl-core", version = "0.1.0" }
caret-ffi = { path = "crates/caret-ffi", version = "0.1.0" }
cc = "=1.4.6"
cxx = "=1.0.202"
cxx-build = "=1.0.202"
serde_json = "1.0"
unicode-segmentation = "=1.13.3"
parley_engine = { version = "=0.12.0", features = ["complex-scripts"] }
parley = { version = "=0.12.0", features = ["complex-scripts"] }
swash = "=0.2.10"
fontique = { version = "=0.12.0", features = ["system", "fontconfig-dlopen"] }
linebender_resource_handle = "=0.1.1"
icu_segmenter = { version = "=2.3.0", features = ["unstable"] }
icu_locale_core = "2.3.0"
icu_properties = { version = "=2.3.0", features = ["compiled_data"] }
criterion = "0.8.2"
pest = "2.8"
pest_derive = "2.8"
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[workspace.lints.rust]
# 默认拒绝 unsafe。已登记例外只有 caret-foundation::crash，模块级 allow。
# 手写 unsafe 必须逐块写 // SAFETY:。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# 测试和 build script 也必须显式处理失败。
unwrap_used = "deny"
expect_used = "deny"

# Debug GUI 仍保留符号，但关键排版路径使用优化代码，避免百万字符文档在本地开发构建中卡顿。
[profile.dev.package.caret-app]
opt-level = 2

[profile.dev.package.caret-engine]
opt-level = 2

[profile.dev.package.caret-layout]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.parley_engine]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2

[profile.dev.package.icu_segmenter]
opt-level = 2

[profile.dev.package.icu_properties]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2
