[package]
name = "caret-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# caret-ffi 只经构建过程消费：普通依赖边提供 DEP_CARET_FFI_* links metadata
# （Cargo 不把纯 build-dependencies 的 links metadata 注入构建脚本），
# build-dependencies 边保证 build script 运行时 staticlib 已产出。两条边都不是
# 目标代码引用，由这里和 workspace 的 cargo::unused_dependencies allow 压制误报。
[package.metadata.cargo-machete]
ignored = ["caret-ffi"]

[dependencies]
caret-ffi.workspace = true

# 构建脚本调度 CMake、生成 TS，并读取已经产出的 staticlib。不从这里再启动 Cargo。
[build-dependencies]
caret-ffi.workspace = true
caret-dsl-core.workspace = true
caret-build.workspace = true
