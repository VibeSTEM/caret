# 恢复 Cargo home 与托管工具/依赖缓存（任务 006）。全部 job 只恢复；
# 保存由日常 check 和 nightly full-tests 的可信 main 事件执行。Cargo 扩展成品由
# caret-cargo-tool-cache 单独缓存；不恢复 cargo-build 临时编译树。键的定义以
# caret-cache-save 为单一来源，改键时两处必须同步。
name: Restore caret caches
description: 按 scope 恢复 cargo-home 与 tools/deps 缓存
inputs:
  cargo_home:
    description: 是否恢复 ~/.cargo 的 index/cache/git
    required: false
    default: "true"
  tools_deps:
    description: 是否恢复 .toolchain/ 下已安装的工具、Qt 与 SDK
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.cargo_home == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
        key: cargo-home-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-home-${{ runner.os }}-${{ runner.arch }}-

    - if: inputs.tools_deps == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          .toolchain/tools
          .toolchain/qt
          .toolchain/sdk
          !.toolchain/tools/cargo-*
        key: caret-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/caret-build/Cargo.toml', 'crates/caret-build/src/*.rs', 'native/CMakeLists.txt', 'native/cmake/*.cmake', 'native/cmake/**/*.cmake', 'native/cmake/*.json') }}
        restore-keys: |
          caret-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-
