# 变更路径分类（任务 006）。输出：
#   code       —— rust/native/qml 任一命中即 true（纯文档为 false）
#   cargo_deps —— Cargo 清单或 deny.toml 变更
#   rust / native / qml —— 对应域是否有变更
#   test_packages / native_labels —— PR 受影响测试选择；无法计算时回退全量
#   changed_paths —— 统一的变更路径 JSON，供文件级格式与 lint 复用
#   full_quality —— 公共工具配置、空 CI diff 或未知范围时启用完整质量检查
# 保守默认：未识别路径一律视为代码触发全量检查；纯文档是唯一可整场跳过的类别。
# .gitattributes 影响检出字节，保留在全量检查类别。
# 基线：PR 对 base 分支取 merge-base diff，push 对 event.before 取累计 diff；
# 新分支/强推/空 diff 回退全量。调用方必须先 checkout 且 fetch-depth: 0
#（本地 composite action 的解析本身依赖工作区已有仓库）。
name: Changed path categories
description: 按变更路径输出代码域、测试范围和变更文件清单
outputs:
  code:
    value: ${{ steps.filter.outputs.code }}
  cargo_deps:
    value: ${{ steps.filter.outputs.cargo_deps }}
  rust:
    value: ${{ steps.filter.outputs.rust }}
  native:
    value: ${{ steps.filter.outputs.native }}
  qml:
    value: ${{ steps.filter.outputs.qml }}
  test_packages:
    value: ${{ steps.filter.outputs.test_packages }}
  test_packages_l1:
    value: ${{ steps.filter.outputs.test_packages_l1 }}
  test_packages_l2:
    value: ${{ steps.filter.outputs.test_packages_l2 }}
  native_labels:
    value: ${{ steps.filter.outputs.native_labels }}
  full_tests:
    value: ${{ steps.filter.outputs.full_tests }}
  full_quality:
    value: ${{ steps.filter.outputs.full_quality }}
  changed_paths:
    value: ${{ steps.filter.outputs.changed_paths }}
runs:
  using: composite
  steps:
    - id: filter
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        files=""
        if [ "$EVENT_NAME" = "pull_request" ]; then
          files="$(git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" || true)"
        elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          files="$(git diff --no-renames --name-only "$BEFORE" HEAD || true)"
        fi

        # 分类、lint 域和测试闭包都由 CI/本地共用的 Rust 选择器计算。
        # 选择器无法运行时让 CI 明确失败，不回退到第二套 shell 分类。
        printf '%s\n' "$files" | cargo run --quiet --locked --package caret-tests -- test-plan --ci >> "$GITHUB_OUTPUT"
